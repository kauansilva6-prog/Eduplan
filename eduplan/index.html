<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduPlan</title>
<!-- Define o título que aparece na aba do navegador -->

<link rel="stylesheet" href="style.css">
<!-- Importa o arquivo de estilos externo. Separamos HTML e CSS
     em arquivos diferentes: o HTML cuida da ESTRUTURA do conteúdo,
     e o CSS cuida da APARÊNCIA -->

</head>
<body>
<!-- <body> é onde fica tudo que o usuário realmente VÊ na tela -->

<!-- ============================================= -->
<!-- CABEÇALHO: fica fixo no topo da página          -->
<!-- Nesta aula: só a versão para computador          -->
<!-- (o menu para celular a gente faz na próxima aula) -->
<!-- ============================================= -->
<header class="header">
<!-- <header> é uma tag semântica: ela existe especificamente
     pra marcar o cabeçalho do site. Isso ajuda buscadores e
     leitores de tela a entenderem a estrutura da página.
     class="header" conecta essa tag com o estilo que criamos
     no arquivo style.css -->

  <div class="header-inner">
  <!-- Essa div é só um "envelope" interno, usado pra limitar
       a largura do conteúdo e organizar os itens com Flexbox
       (isso é feito lá no CSS, na classe .header-inner) -->

    <a href="#" class="logo">
    <!-- O logo inteiro (imagem + texto) é um único link.
         href="#" é um link "vazio", que por enquanto não leva
         a lugar nenhum — depois isso vira o link pra home -->

      <img class="logo-img" src="./assets/image.png" alt="Logo do Eduplan">
      <!-- <img> exibe uma imagem.
           src indica o caminho do arquivo da imagem.
           alt é um texto alternativo, mostrado se a imagem não
           carregar, e também lido por leitores de tela —
           é uma boa prática sempre preencher o alt -->

      <h2 style="color: #1d4ed8">Edu<span style="color:#16a34a">Plan</span></h2>
      <!-- <h2> é um título. Aqui usamos ele pro nome da marca.
           Dividimos o texto em duas partes: "Edu" fica azul
           (cor do próprio h2) e "Plan" fica dentro de um <span>
           com cor verde. O <span> serve justamente pra isso:
           estilizar só um PEDACINHO do texto, sem afetar o resto -->
    </a>

    <ul class="nav" id="nav">
    <!-- <ul> (unordered list) é uma lista sem numeração.
         Usamos ela pro menu porque, semanticamente, um menu
         É uma lista de links.
         id="nav" é um identificador único, útil depois pra
         controlar esse menu com JavaScript (por exemplo, no
         menu do celular que vamos fazer na próxima aula) -->

      <li><a href="#" class="active">Início</a></li>
      <!-- <li> (list item) é cada item da lista.
           Dentro dele colocamos o link <a>.
           class="active" indica que essa é a página em que o
           usuário está agora — é isso que deixa o link azul
           com a linha embaixo, conforme definido no CSS -->

      <li><a href="#">Recursos</a></li>
      <li><a href="#">Benefícios</a></li>
      <li><a href="#">Sobre</a></li>
      <li><a href="#">Depoimentos</a></li>
      <li><a href="#">Contato</a></li>
      <!-- Os outros links do menu seguem o mesmo padrão,
           só sem a classe "active" -->
    </ul>

    <div class="actions">
    <!-- Essa div agrupa os dois botões do canto direito do header -->

      <a href="#" class="btn btn-entrar">Entrar</a>
      <!-- Repare que o botão usa DUAS classes ao mesmo tempo:
           "btn" (estilo base, compartilhado por todos os botões)
           e "btn-entrar" (o estilo específico desse botão).
           Isso evita repetir código no CSS -->

      <a href="#" class="btn btn-cadastrar">Cadastrar</a>
      <!-- Mesma lógica: "btn" + "btn-cadastrar", o botão de
           destaque (verde) que queremos que mais gente clique -->
    </div>

  </div>
</header>

</body>
</html>
