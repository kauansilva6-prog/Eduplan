<body>

        <!-- essa div é so um "envelope" interno, usado 
         para limitar a largura do conteúdo e  organizar
        os itens com Flexbox -->
         <div class="header-inner">
            <a href="#" class="logo">
                <img src="./assets/image.png" alt="logo do Eduplan">
                <h2 style="color: #00008b;">Edu <span style="color: #16a34a;">plan</span></h2>
             </a>   
             <ul class="nav" id="nav">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Recursos</a></li>
                <li><a href="#">Beneficios</a> </li>
                <li><a href="#">sobre</a></li>
                <li><a href="#">Depoimemtos</a></li>
                <li><a href="#">Contato</a></li>
             </ul>
             <div class="actions">
                <a href="#" class="btn btn-entrar">entrar</a> 
                <a href="#" class="btn btn-cadastrar
                ">cadastrar</a>
             </div>
        </div>
    </header>
    
</body>
</html>
